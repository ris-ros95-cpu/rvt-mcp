# To enable: copy to .github/workflows/release.yml (needs a token with the "workflow" scope).
name: release

# Push a tag like v1.1.0-chat.1 to build the client setup ZIP on Windows and
# attach it to a GitHub Release of this fork.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build client setup ZIP
        shell: pwsh
        run: pwsh scripts/package-client-setup.ps1 -Config Release
      - name: Verify ZIP (no live Revit)
        shell: pwsh
        run: |
          $version = (Get-Content server.json -Raw | ConvertFrom-Json).version
          python tests/installer/verify-package.py "build/client-setup/RvtMcp.Setup-v$version-win-x64.zip" --output setup-verification.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/client-setup/RvtMcp.Setup-*-win-x64.zip
            build/client-setup/RvtMcp.Setup-*-win-x64.zip.sha256
